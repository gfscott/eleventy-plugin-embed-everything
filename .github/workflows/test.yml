name: CI
permissions:
  contents: read
on:
  push:
    paths-ignore:
      - '.changeset/*.md'
jobs:

  unit_tests:
    name: Node.js ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        node: ["20", "22", "24", "26"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install pnpm and set up Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - name: Run unit tests
        run: pnpm test

  code_coverage:
    name: Check test coverage
    runs-on: "ubuntu-latest"
    needs: unit_tests
    # Only run on the main repo, not forks
    if: github.repository == 'gfscott/eleventy-plugin-embed-everything'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Install pnpm and set up Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
      - name: Run coverage
        run: pnpm coverage
      - name: Upload coverage to Codecov.io
        uses: codecov/codecov-action@v7
        with:
          codecov_yml_path: ./codecov.yml
