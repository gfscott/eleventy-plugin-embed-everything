name: CI
permissions:
  contents: read
on:
  push:
    paths-ignore:
      - '.changeset/*.md'
jobs:

  unit_tests:
    name: Node.js ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        node: ["22", "24", "26"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pnpm and set up Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          runtime: node@${{ matrix.node }}
          cache: true
      - name: Run unit tests
        run: pnpm test

  code_coverage:
    name: Check test coverage
    runs-on: "ubuntu-latest"
    needs: unit_tests
    # Only run on the main repo, not forks
    if: github.repository == 'gfscott/eleventy-plugin-embed-everything'
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pnpm and set up Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1
        with:
          runtime: node@26
          cache: true
      - name: Run coverage
        run: pnpm coverage
      - name: Upload coverage to Codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          codecov_yml_path: ./codecov.yml
          version: v11.3.2
