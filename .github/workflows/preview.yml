name: Preview packages
permissions:
  contents: read
on:
  workflow_dispatch:
  # Only runs after the CI workflow (test.yml) finishes
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  preview:
    runs-on: ubuntu-latest
    # Only runs in the main repo, not in forks, and only if CI passed
    if: >-
      github.repository == 'gfscott/eleventy-plugin-embed-everything' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # workflow_run executes against the default branch; check out the commit CI tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install pnpm and set up Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true
      - name: Publish preview releases
        run: pnpm exec pkg-pr-new publish --pnpm './packages/*'
